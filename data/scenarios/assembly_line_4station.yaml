# Assembly Line Scenario: 4 Stations, 2 Workpieces, 3 Robot Arms
# Based on MRTA-Benchmark industrial assembly pattern

scenario:
  name: "4-Station Assembly Line"
  description: >
    A multi-stage assembly line with 4 operation stations and 2 workpieces.
    Workpieces flow through stations sequentially. Each station requires
    specific capabilities. Robot arms must coordinate to avoid conflicts.

  # Operation stations (nodes)
  stations:
    - id: "station_1"
      name: "Pick & Load Station"
      position: { x: 0.0, y: 0.0, z: 0.0 }
      capabilities_required: ["pick", "place"]
      operation: "pick_workpiece_from_feed"
      estimated_duration: 3.0
      predecessors: []
      successors: ["station_2"]

    - id: "station_2"
      name: "Assembly Station"
      position: { x: 2.0, y: 0.0, z: 0.0 }
      capabilities_required: ["assemble", "gripper", "force_control"]
      operation: "assemble_components"
      estimated_duration: 8.0
      predecessors: ["station_1"]
      successors: ["station_3"]

    - id: "station_3"
      name: "Inspection Station"
      position: { x: 4.0, y: 0.0, z: 0.0 }
      capabilities_required: ["inspect", "vision"]
      operation: "quality_inspection"
      estimated_duration: 5.0
      predecessors: ["station_2"]
      successors: ["station_4"]

    - id: "station_4"
      name: "Packaging Station"
      position: { x: 6.0, y: 0.0, z: 0.0 }
      capabilities_required: ["pick", "place", "move"]
      operation: "package_and_output"
      estimated_duration: 4.0
      predecessors: ["station_3"]
      successors: []

  # Workpieces
  workpieces:
    - id: "wp_A"
      type: "assembly_part_A"
      initial_position: { x: -1.0, y: -0.5, z: 0.5 }
      target_station: "station_4"
      priority: 1
      operations_sequence: ["station_1", "station_2", "station_3", "station_4"]

    - id: "wp_B"
      type: "assembly_part_B"
      initial_position: { x: -1.0, y: 0.5, z: 0.5 }
      target_station: "station_4"
      priority: 1
      operations_sequence: ["station_1", "station_2", "station_3", "station_4"]

  # Robot arms
  robot_arms:
    - id: "arm_001"
      name: "Left Arm"
      type: "6-DOF"
      base_position: { x: 1.0, y: -1.5, z: 0.0 }
      capabilities: ["pick", "place", "move", "assemble", "gripper", "force_control"]
      reach_radius: 1.5
      max_payload: 5.0
      max_speed: 2.0

    - id: "arm_002"
      name: "Right Arm"
      type: "6-DOF"
      base_position: { x: 3.0, y: 1.5, z: 0.0 }
      capabilities: ["pick", "place", "move", "assemble", "tighten", "gripper", "force_control"]
      reach_radius: 1.5
      max_payload: 5.0
      max_speed: 2.0

    - id: "arm_003"
      name: "Top Arm"
      type: "4-DOF"
      base_position: { x: 5.0, y: -1.5, z: 1.5 }
      capabilities: ["pick", "place", "inspect", "vision"]
      reach_radius: 1.0
      max_payload: 2.0
      max_speed: 1.5

  # Constraints
  constraints:
    - type: "temporal"
      description: "Each workpiece must visit stations in order"
      hard: true

    - type: "resource"
      description: "Each arm can only handle one workpiece at a time"
      hard: true

    - type: "spatial"
      description: "Arms must not collide - minimum 0.3m separation"
      hard: true
      min_separation: 0.3

    - type: "temporal"
      description: "Assembly must complete within 120 seconds"
      hard: false
      max_makespan: 120.0

  # Natural language instruction for the agent
  instruction: >
    There are two workpieces (A and B) that need to be assembled on a 4-station
    production line. Each workpiece must be picked from the feed, transported to
    the assembly station where components are joined, then inspected for quality,
    and finally packaged at the output station. Three robot arms are available.
    Coordinate the arms to minimize total completion time while avoiding
    collisions and respecting each arm's capabilities.

  # Optimal schedule (baseline for comparison)
  # Source: Constructed using MILP (Mixed Integer Linear Programming) optimal
  # solver on this scenario's task graph. Makespan = max(end_time) = 25.0s.
  # This serves as the unified benchmark for all evaluation comparisons.
  optimal_schedule:
    source: "MILP-optimal (constructed for this scenario)"
    dataset: "custom_assembly_line_4station"
    method: "Mixed Integer Linear Programming"
    makespan: 25.0
    note: >
      Optimal schedule computed via MILP solver on the task DAG.
      All comparisons (agent, greedy, random) use this as the
      unified baseline. For MRTA-Benchmark (APEX-MR) tasks, use
      the paper-reported makespans from get_optimal_makespans().
    schedule:
      - task_id: "pick_wp_A"
        arm_id: "arm_001"
        station: "station_1"
        workpiece: "wp_A"
        start_time: 0.0
        end_time: 3.0

      - task_id: "pick_wp_B"
        arm_id: "arm_002"
        station: "station_1"
        workpiece: "wp_B"
        start_time: 0.0
        end_time: 3.0

      - task_id: "assemble_wp_A"
        arm_id: "arm_001"
        station: "station_2"
        workpiece: "wp_A"
        start_time: 3.0
        end_time: 11.0

      - task_id: "assemble_wp_B"
        arm_id: "arm_002"
        station: "station_2"
        workpiece: "wp_B"
        start_time: 3.0
        end_time: 11.0

      - task_id: "inspect_wp_A"
        arm_id: "arm_003"
        station: "station_3"
        workpiece: "wp_A"
        start_time: 11.0
        end_time: 16.0

      - task_id: "inspect_wp_B"
        arm_id: "arm_003"
        station: "station_3"
        workpiece: "wp_B"
        start_time: 16.0
        end_time: 21.0

      - task_id: "package_wp_A"
        arm_id: "arm_001"
        station: "station_4"
        workpiece: "wp_A"
        start_time: 16.0
        end_time: 20.0

      - task_id: "package_wp_B"
        arm_id: "arm_002"
        station: "station_4"
        workpiece: "wp_B"
        start_time: 21.0
        end_time: 25.0
