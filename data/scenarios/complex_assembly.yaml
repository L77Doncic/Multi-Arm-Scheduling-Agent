# Complex Assembly Scenario: 5 Stations, 3 Workpieces, 3 Robot Arms
# Demonstrates parallel operations and resource contention

scenario:
  name: "Complex Parallel Assembly"
  description: >
    A more complex assembly line with 5 stations and 3 workpieces.
    Some operations can run in parallel while others must be sequential.
    The inspection station is a bottleneck shared by all workpieces.

  stations:
    - id: "feed_station"
      name: "Material Feed"
      position: { x: 0.0, y: 0.0, z: 0.0 }
      capabilities_required: ["pick"]
      operation: "pick_from_feed"
      estimated_duration: 2.0
      predecessors: []
      successors: ["prep_station", "weld_station"]

    - id: "prep_station"
      name: "Preparation Station"
      position: { x: 2.0, y: -1.0, z: 0.0 }
      capabilities_required: ["place", "move"]
      operation: "prepare_workpiece"
      estimated_duration: 4.0
      predecessors: ["feed_station"]
      successors: ["assembly_station"]

    - id: "weld_station"
      name: "Welding Station"
      position: { x: 2.0, y: 1.0, z: 0.0 }
      capabilities_required: ["weld"]
      operation: "weld_joints"
      estimated_duration: 6.0
      predecessors: ["feed_station"]
      successors: ["assembly_station"]

    - id: "assembly_station"
      name: "Final Assembly"
      position: { x: 4.0, y: 0.0, z: 0.0 }
      capabilities_required: ["assemble", "tighten"]
      operation: "final_assembly"
      estimated_duration: 7.0
      predecessors: ["prep_station", "weld_station"]
      successors: ["qc_station"]

    - id: "qc_station"
      name: "Quality Control"
      position: { x: 6.0, y: 0.0, z: 0.0 }
      capabilities_required: ["inspect"]
      operation: "quality_check"
      estimated_duration: 3.0
      predecessors: ["assembly_station"]
      successors: []

  workpieces:
    - id: "wp_1"
      type: "motor_housing"
      initial_position: { x: -1.0, y: -0.5, z: 0.5 }
      priority: 1
      operations_sequence: ["feed_station", "prep_station", "assembly_station", "qc_station"]

    - id: "wp_2"
      type: "bracket"
      initial_position: { x: -1.0, y: 0.0, z: 0.5 }
      priority: 2
      operations_sequence: ["feed_station", "weld_station", "assembly_station", "qc_station"]

    - id: "wp_3"
      type: "cover_plate"
      initial_position: { x: -1.0, y: 0.5, z: 0.5 }
      priority: 1
      operations_sequence: ["feed_station", "prep_station", "assembly_station", "qc_station"]

  robot_arms:
    - id: "arm_A"
      name: "Precision Arm"
      type: "6-DOF"
      base_position: { x: 1.0, y: -2.0, z: 0.0 }
      capabilities: ["pick", "place", "move", "assemble", "tighten"]
      reach_radius: 1.5
      max_payload: 3.0

    - id: "arm_B"
      name: "Heavy-Duty Arm"
      type: "6-DOF"
      base_position: { x: 3.0, y: 2.0, z: 0.0 }
      capabilities: ["pick", "place", "move", "weld", "assemble"]
      reach_radius: 2.0
      max_payload: 10.0

    - id: "arm_C"
      name: "Inspection Arm"
      type: "4-DOF"
      base_position: { x: 5.0, y: -1.0, z: 1.0 }
      capabilities: ["inspect", "pick", "place"]
      reach_radius: 1.0
      max_payload: 1.0

  constraints:
    - type: "temporal"
      description: "Sequential station visits per workpiece"
      hard: true

    - type: "resource"
      description: "One workpiece per arm at a time"
      hard: true

    - type: "spatial"
      description: "Minimum 0.3m arm separation"
      hard: true
      min_separation: 0.3

    - type: "resource"
      description: "QC station processes one workpiece at a time"
      hard: true

    - type: "temporal"
      description: "Target makespan under 60 seconds"
      hard: false
      max_makespan: 60.0

  instruction: >
    Three workpieces (motor housing, bracket, cover plate) need processing
    through a 5-station line. The motor housing and cover plate go through
    preparation, while the bracket goes through welding. All three converge
    at the assembly station, then pass through quality control one at a time.
    Three robot arms must coordinate. Minimize total makespan.
